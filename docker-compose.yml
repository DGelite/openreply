# ==============================================================================
# OPENREPLY SAAS - DOCKER COMPOSE ORCHESTRATION (Standard compose.yaml & docker-compose.yml)
# ==============================================================================
# Strict Service Isolation Architecture:
#   - web:    Next.js 16 Application Server (Port 3000, non-root user 'nextjs')
#   - worker: Dedicated Instagram DM & Event Queue Processor (Standalone Node process)
#   - mysql:  MariaDB 10.11 LTS Primary Datastore (Loopback bound, internal bridge)
#
# Port Isolation Non-Negotiables:
#   - Ports 80 & 8000 are RESERVED for Booking & CRM Web Server (WAMP / Apache / Nginx).
#   - Ports 3306 & 3309 are RESERVED for Booking & CRM Database instances.
#   - OpenReply Web maps to host port 3000 (configurable via ${PORT:-3000}).
#   - OpenReply DB maps to host port 3308 (configurable via ${DB_PORT:-3308}, 127.0.0.1 only).
#
# Commands:
#   Start stack:    docker compose up -d
#   Build & start:  docker compose up -d --build
#   Check logs:     docker compose logs -f
#   Check status:   docker compose ps
#   Stop stack:     docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. OPENREPLY NEXT.JS WEB APPLICATION
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: openreply:latest
    container_name: openreply-web
    restart: unless-stopped
    ports:
      # Host port default 3000 (or 3001, 8080). Strictly avoids 80 & 8000.
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WORKER_STANDALONE=true
      - DISABLE_INTERNAL_WORKER=true
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${DB_USER:-openreply}:${DB_PASS:-openreply_pass_change_me}@mysql:3306/${DB_NAME:-digitale_digitaleliteisntal}}
      - BOOKING_API_URL=${DOCKER_BOOKING_API_URL:-${BOOKING_API_URL:-${PHP_ADMIN_API_URL:-http://host.docker.internal/api_openreply.php}}}
      - PHP_ADMIN_API_URL=${DOCKER_BOOKING_API_URL:-${PHP_ADMIN_API_URL:-${BOOKING_API_URL:-http://host.docker.internal/api_openreply.php}}}
    extra_hosts:
      # Maps host.docker.internal to the host gateway for Single-Server host WAMP access
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - openreply-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health?probe=liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. DEDICATED INSTAGRAM BACKGROUND WORKER
  # ----------------------------------------------------------------------------
  worker:
    image: openreply:latest
    container_name: openreply-worker
    command: ["npx", "tsx", "worker/dm-worker.ts"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_STANDALONE=true
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${DB_USER:-openreply}:${DB_PASS:-openreply_pass_change_me}@mysql:3306/${DB_NAME:-digitale_digitaleliteisntal}}
      - BOOKING_API_URL=${DOCKER_BOOKING_API_URL:-${BOOKING_API_URL:-${PHP_ADMIN_API_URL:-http://host.docker.internal/api_openreply.php}}}
      - PHP_ADMIN_API_URL=${DOCKER_BOOKING_API_URL:-${PHP_ADMIN_API_URL:-${BOOKING_API_URL:-http://host.docker.internal/api_openreply.php}}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - openreply-net

  # ----------------------------------------------------------------------------
  # 3. MARIADB 10.11 LTS PRIMARY DATABASE
  # ----------------------------------------------------------------------------
  mysql:
    image: mariadb:10.11
    container_name: openreply-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MARIADB_DATABASE: ${DB_NAME:-digitale_digitaleliteisntal}
      MARIADB_USER: ${DB_USER:-openreply}
      MARIADB_PASSWORD: ${DB_PASS:-openreply_pass_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-digitale_digitaleliteisntal}
      MYSQL_USER: ${DB_USER:-openreply}
      MYSQL_PASSWORD: ${DB_PASS:-openreply_pass_change_me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    ports:
      # Strictly bound to 127.0.0.1 on port 3308. Never touches 3306 or 3309!
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      # Named persistent volume guarantees data survives container lifecycles
      - mysql_data:/var/lib/mysql
      # Clean DDL schema bootstrap on fresh volume initialization
      - ./deploy/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - openreply-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD:-$${MYSQL_ROOT_PASSWORD}} || mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  openreply-net:
    driver: bridge

volumes:
  mysql_data:
    name: openreply_mysql_data
